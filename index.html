<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Flight Deck Trainer</title>
<style>
:root{
  --bg:#0b1220;--panel:#121b2e;--panel2:#18233a;--line:#26344f;--text:#e6edf7;--dim:#8fa0bd;
  --cyan:#4cc9f0;--green:#3ddc84;--amber:#ffb020;--red:#ff6b6b;--mag:#d58cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);min-height:100vh}
#app{max-width:780px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.small{font-size:.85rem}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.08em;color:var(--green);font-size:.9rem;margin-right:auto}
.nav button{padding:8px 12px;border-radius:8px;color:var(--dim);font-size:.9rem;min-height:40px}
.nav button.on{color:var(--cyan);background:var(--panel)}
.rankline{display:flex;align-items:baseline;gap:10px;margin-top:8px;font-size:.85rem;flex-wrap:wrap}
.rank{color:var(--mag);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--cyan);border-radius:3px}
.bar.g>i{background:var(--green)}.bar.m>i{background:var(--mag)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card.hl{border-color:var(--cyan)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--cyan);color:#06202b;border-color:var(--cyan)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;min-height:56px}
.chap .no{font-family:var(--mono);color:var(--cyan);width:2.2em;flex:none;font-weight:700}
.chap.off{opacity:.45;cursor:default;background:transparent}
.chap.off .no{color:var(--dim)}
.chap .meta{font-size:.8rem;color:var(--dim)}
.pill{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.due{color:var(--amber);border-color:var(--amber)}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.red{color:var(--red);border-color:var(--red)}
.pill.cy{color:var(--cyan);border-color:var(--cyan)}
.big{font-family:var(--mono);font-size:2rem;font-weight:700;line-height:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3 .card{margin:0;padding:12px;text-align:center}
.stats3 .lbl{font-size:.75rem;color:var(--dim);margin-top:4px}
ul.brief{margin:8px 0 0;padding-left:1.1em}
ul.brief li{margin-bottom:10px;max-width:65ch}
.q{font-size:1.1rem;font-weight:600;max-width:60ch;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;min-height:48px}
.opt .k{font-family:var(--mono);color:var(--dim);flex:none;width:1.4em}
.opt.sel{border-color:var(--cyan);background:var(--panel2)}
.opt.sel .k{color:var(--cyan)}
.opt.right{border-color:var(--green)}.opt.right .k{color:var(--green)}
.opt.wrong{border-color:var(--red)}.opt.wrong .k{color:var(--red)}
.opt:disabled{cursor:default;opacity:1}
.opt .tag{margin-left:auto;font-size:.75rem;font-family:var(--mono);flex:none;padding-left:8px}
.numrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
input[type=text],input[type=password],select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.numrow input{max-width:160px;font-family:var(--mono);font-size:1.2rem}
.numrow.wide input{max-width:340px;font-family:var(--sans);font-size:1.05rem}
.built{display:flex;flex-direction:column;gap:6px;min-height:56px;border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.built:empty::before{content:"Tap the items below in the correct order";color:var(--dim);font-size:.9rem;padding:8px}
.pool{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.chipb{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px;width:100%}
.chipb .k{font-family:var(--mono);color:var(--cyan);flex:none;width:1.4em}
.chipb.right{border-color:var(--green)}.chipb.wrong{border-color:var(--red)}
.chipb:disabled{cursor:default}
.mt{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:8px 12px;align-items:center;margin-bottom:8px}
.mt .l{font-family:var(--mono);font-weight:700;color:var(--cyan)}
.conf{margin-top:16px}
.conf .row{gap:8px}
.conf .btn{flex:1;min-width:96px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;border:1px solid var(--line);background:var(--panel)}
.fb.ok{border-color:var(--green)}.fb.no{border-color:var(--red)}
.fb .v{font-weight:700;margin-bottom:6px}
.fb.ok .v{color:var(--green)}.fb.no .v{color:var(--red)}
.fb .why{max-width:65ch}
.fb .ref{display:inline-block;margin-top:10px}
.note{border-left:3px solid var(--amber);padding:6px 12px;margin:10px 0;color:var(--amber);font-size:.9rem}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.85rem;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tw{overflow-x:auto}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--panel2);border-radius:8px;padding:8px 4px;text-align:center}
.boxes b{display:block;font-family:var(--mono);font-size:1.1rem}
.boxes span{font-size:.7rem;color:var(--dim)}
.lock{max-width:420px;margin:12vh auto 0;text-align:center}
.lock .logo{font-family:var(--mono);color:var(--green);letter-spacing:.12em;font-weight:700;font-size:1.1rem;margin-bottom:6px}
.lock form{margin-top:22px;display:grid;gap:12px;text-align:left}
.lock label.chk{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--dim)}
.err{color:var(--red);min-height:1.5em;font-size:.9rem}
.msg{color:var(--green);font-size:.9rem;min-height:1.4em;margin-top:8px}
textarea{min-height:110px;font-family:var(--mono);font-size:.8rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:48px;min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.seg button.on{border-color:var(--cyan);color:var(--cyan)}
.miss{padding:10px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
@media (max-width:480px){.stats3 .big{font-size:1.5rem}.nav button{padding:8px 9px}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>

const KEY='flightdeck-trainer-v1', KKEY='flightdeck-trainer-key';
const INTERVALS=[0,1,3,7,16,35];
const RANKS=[[0,'Jump Seat Observer'],[200,'Cadet'],[600,'Second Officer'],[1300,'First Officer'],[2400,'Senior First Officer'],[4000,'Captain'],[6500,'Line Training Captain'],[10000,'Type Rating Instructor'],[15000,'Type Rating Examiner'],[22000,'Fleet Pilot'],[31000,'Fleet Chief'],[44000,'Nominated Person Flight Operations'],[60000,'Accountable Manager']];
let DB=null, IDX={}, SECS={}, CHS={}, S=null, V={name:'lock'}, SES=null, FLASH='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* ---------- state ---------- */
function blank(){return{v:1,xp:0,items:{},streak:{last:0,days:0,best:0},sessions:0,set:{len:10,conf:true}}}
function normalize(o){
  const b=blank(); if(!o||typeof o!=='object')return b;
  const num=(x,d)=>Number.isFinite(x)&&x>=0?Math.floor(x):d;
  b.xp=num(o.xp,0); b.sessions=num(o.sessions,0);
  if(o.streak&&typeof o.streak==='object'){b.streak.last=num(o.streak.last,0);b.streak.days=num(o.streak.days,0);b.streak.best=num(o.streak.best,0)}
  if(o.set&&typeof o.set==='object'){if([5,10,15,20].includes(o.set.len))b.set.len=o.set.len;b.set.conf=o.set.conf!==false}
  if(o.items&&typeof o.items==='object')for(const id of Object.keys(o.items)){
    const s=o.items[id]; if(!s||typeof s!=='object'||!/^[a-z0-9-]{3,40}$/.test(id))continue;
    b.items[id]={b:Math.min(5,num(s.b,0)),d:num(s.d,0),n:num(s.n,0),ok:Math.min(num(s.ok,0),num(s.n,0)),sw:s.sw?1:0,l:num(s.l,0)};
  }
  return b;
}
let STORE_OK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORE_OK=false}}
function load(){let o=null;try{localStorage.setItem('__fdt','1');localStorage.removeItem('__fdt');o=JSON.parse(localStorage.getItem(KEY))}catch(e){STORE_OK=false}return normalize(o)}
function rankOf(xp){let i=0;for(let k=0;k<RANKS.length;k++)if(xp>=RANKS[k][0])i=k;return i}

/* ---------- crypto ---------- */
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=u=>{let s='';for(const c of u)s+=String.fromCharCode(c);return btoa(s)};
async function keyFromPass(pass){
  const n=pass.trim().toLowerCase().replace(/\s+/g,' ');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(n),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},km,256);
  return new Uint8Array(bits);
}
async function openWith(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(PAYLOAD.iv)},key,ub(PAYLOAD.ct));
  DB=JSON.parse(new TextDecoder().decode(pt)); index();
}
function index(){
  IDX={};SECS={};CHS={};
  for(const g of DB.groups)for(const m of g.manuals)for(const c of m.chapters){
    CHS[c.id]={ch:c,man:m};
    for(const s of c.sections){SECS[s.id]={sec:s,ch:c,man:m};for(const it of s.items)IDX[it.id]={it,sec:s,ch:c,man:m}}
  }
}

/* ---------- queries ---------- */
const allIds=()=>Object.keys(IDX);
const secIds=s=>s.items.map(i=>i.id);
const chIds=c=>c.sections.flatMap(secIds);
function stat(ids){
  const t=today();let seen=0,due=0,box=0,n=0,ok=0,sw=0;
  for(const id of ids){const s=S.items[id];if(!s)continue;seen++;if(s.d<=t)due++;box+=s.b;n+=s.n;ok+=s.ok;if(s.sw)sw++}
  return{total:ids.length,seen,due,fresh:ids.length-seen,mastery:ids.length?Math.round(100*box/(5*ids.length)):0,n,ok,sw};
}
function light(n,ok){if(n<3)return['–','pill'];const p=pct(ok,n);return p<60?[p+'%','pill red']:p<85?[p+'%','pill due']:[p+'%','pill ok']}

/* ---------- sessions ---------- */
function buildQueue(ids,len,interleave){
  const t=today();
  const due=shuffle(ids.filter(i=>S.items[i]&&S.items[i].d<=t));
  let fresh=ids.filter(i=>!S.items[i]); if(interleave)fresh=shuffle(fresh);
  let q=due.concat(fresh).slice(0,len), ahead={};
  if(!q.length){q=ids.filter(i=>S.items[i]).sort((a,b)=>S.items[a].b-S.items[b].b||S.items[a].d-S.items[b].d).slice(0,len);q=shuffle(q);q.forEach(i=>ahead[i]=1)}
  else if(interleave)q=shuffle(q);
  return{q,ahead};
}
function startSession(title,ids,opt){
  opt=opt||{};
  const {q,ahead}=opt.fixed?{q:shuffle(ids).slice(0,S.set.len),ahead:{}}:buildQueue(ids,S.set.len,!!opt.interleave);
  if(!q.length){FLASH='Nothing to train here yet.';render();return}
  const t0=today();q.forEach(i=>{if(S.items[i]&&S.items[i].d>t0)ahead[i]=1});
  SES={title,queue:q,i:0,ahead,first:{},retest:{},xp:0,run:0,back:opt.back||{name:'home'},rank0:rankOf(S.xp),phase:'q',cur:null,practice:Object.keys(ahead).length>0};
  prep(); go('session');
}
function prep(){
  const id=SES.queue[SES.i], it=IDX[id].it, cur={id,sel:null,multi:{},num:'',map:{},order:null,right:null};
  if(it.t==='mc'||it.t==='ms')cur.order=shuffle(it.o.map((_,i)=>i));
  if(it.t==='mt')cur.right=shuffle(it.pairs.map(p=>p[1]));
  if(it.t==='od'){cur.built=[];do{cur.pool=shuffle(it.seq.map((_,i)=>i))}while(cur.pool.every((v,i)=>v===i))}
  SES.cur=cur;SES.phase='q';SES.res=null;
}
function answered(it,c){
  if(it.t==='mc'||it.t==='tf')return c.sel!==null;
  if(it.t==='ms')return Object.values(c.multi).some(Boolean);
  if(it.t==='num'||it.t==='fill')return c.num.trim()!=='';
  if(it.t==='mt')return it.pairs.every((_,i)=>c.map[i]);
  if(it.t==='od')return c.built.length===it.seq.length;
  return false;
}
const normF=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function grade(it,c){
  if(it.t==='mc')return c.sel===it.a;
  if(it.t==='tf')return c.sel===it.a;
  if(it.t==='ms'){const want=new Set(it.a);return it.o.every((_,i)=>!!c.multi[i]===want.has(i))}
  if(it.t==='num'){const v=parseFloat(c.num.replace(',','.').replace(/[^0-9.\-]/g,''));return Number.isFinite(v)&&Math.abs(v-it.a)<=(it.tol||0)}
  if(it.t==='mt')return it.pairs.every((p,i)=>c.map[i]===p[1]);
  if(it.t==='fill'){const v=normF(c.num);return v!==''&&it.a.some(x=>normF(x)===v)}
  if(it.t==='od')return c.built.every((v,i)=>v===i);
  return false;
}
function submit(conf){
  const c=SES.cur, it=IDX[c.id].it; if(SES.phase!=='q'||!answered(it,c))return;
  const ok=grade(it,c), t=today(), isRetest=c.id in SES.first, ahead=!!SES.ahead[c.id];
  let st=S.items[c.id]; if(!st)st=S.items[c.id]={b:0,d:t,n:0,ok:0,sw:0,l:t};
  st.n++; if(ok)st.ok++; st.l=t;
  let gain=0;
  if(!isRetest){
    SES.first[c.id]=ok;
    if(ok){
      if(!ahead){st.b=Math.min(5,conf==='guess'?Math.max(st.b,1):st.b+1);st.d=t+INTERVALS[st.b]}
      if(conf!=='guess')st.sw=0;
      SES.run++; gain=10+(SES.run>=3?5:0);
    }else{
      st.b=Math.min(st.b,1)||1; st.d=t+1; if(conf==='sure')st.sw=1; SES.run=0;
    }
  }else if(ok){gain=3}
  if(!ok){
    const r=SES.retest[c.id]||0;
    if(r<2){SES.retest[c.id]=r+1;SES.queue.splice(Math.min(SES.i+4,SES.queue.length),0,c.id)}
  }
  S.xp+=gain;SES.xp+=gain;
  SES.res={ok,conf,gain,isRetest};SES.phase='fb';save();render();
  setTimeout(()=>{const b=document.getElementById('next');if(b)b.focus()},0);
}
function next(){
  if(!SES||SES.phase!=='fb')return;
  SES.i++;
  if(SES.i>=SES.queue.length){finish();return}
  prep();render();window.scrollTo(0,0);
}
function finish(partial){
  const t=today(), k=S.streak;
  if(k.last!==t){k.days=(k.last===t-1)?k.days+1:1;k.last=t;k.best=Math.max(k.best,k.days)}
  if(!partial){S.xp+=25;SES.xp+=25}S.sessions++;save();
  SES.done=true;go('result');
}

/* ---------- rendering ---------- */
function go(name,arg){V={name,arg};render();window.scrollTo(0,0)}
function topBar(){
  const r=rankOf(S.xp), nx=RANKS[r+1], base=RANKS[r][0];
  const w=nx?pct(S.xp-base,nx[0]-base):100;
  const nav=[['home','Home'],['stats','Progress'],['settings','Settings']].map(([n,l])=>`<button data-act="go" data-v="${n}" class="${V.name===n?'on':''}">${l}</button>`).join('');
  return `<div class="top"><div class="top-row"><div class="brand">FLIGHT DECK TRAINER</div><div class="nav">${nav}</div></div>
  <div class="rankline"><span class="rank">${esc(RANKS[r][1])}</span><span class="mono dim">${S.xp} XP</span><div class="bar m" title="Progress to next rank"><i style="width:${w}%"></i></div><span class="dim small">${nx?esc((nx[0]-S.xp)+' XP to '+nx[1]):'Top rank'}</span></div></div>`;
}
function flash(){const f=FLASH;FLASH='';return (STORE_OK?'':`<div class="note">This browser is not saving progress (private mode or storage blocked). Use Settings → Backup before closing.</div>`)+(f?`<div class="note">${esc(f)}</div>`:'')}

function vLock(){
  app.innerHTML=`<div class="lock"><div class="logo">FLIGHT DECK TRAINER</div><p class="dim">Personal study environment. Content is encrypted.</p>
  <form id="lockf"><label for="pw" class="small dim">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label class="chk"><input type="checkbox" id="rem" checked> Stay unlocked on this device</label>
  <button class="btn pri" type="submit" id="unl">Unlock</button><div class="err" id="lerr" role="alert"></div></form></div>`;
  const f=document.getElementById('lockf');
  f.addEventListener('submit',async e=>{
    e.preventDefault();const b=document.getElementById('unl'),er=document.getElementById('lerr');
    if(!window.crypto||!crypto.subtle){er.textContent='This browser context has no Web Crypto. Open the page via https.';return}
    b.disabled=true;b.textContent='Unlocking …';er.textContent='';
    try{const raw=await keyFromPass(document.getElementById('pw').value);await openWith(raw);
      if(document.getElementById('rem').checked){try{localStorage.setItem(KKEY,bu(raw))}catch(_){}}
      S=load();go('home');
    }catch(_){b.disabled=false;b.textContent='Unlock';er.textContent='Wrong passphrase.'}
  });
  document.getElementById('pw').focus();
}

function vHome(){
  const ids=allIds(), st=stat(ids);
  let h=topBar()+flash();
  h+=`<div class="stats3"><div class="card"><div class="big" style="color:var(--amber)">${st.due}</div><div class="lbl">due for review</div></div>
  <div class="card"><div class="big" style="color:var(--green)">${S.streak.last>=today()-1?S.streak.days:0}</div><div class="lbl">day streak</div></div>
  <div class="card"><div class="big" style="color:var(--cyan)">${st.mastery}%</div><div class="lbl">mastery</div></div></div>`;
  h+=`<div class="card hl" style="margin-top:14px"><div class="row"><div class="grow"><h2>Daily review</h2><p class="dim small">${st.due?`${st.due} question${st.due>1?'s':''} due across all loaded chapters, mixed.`:(st.seen?'Nothing due today. Start a new section or run a mixed practice.':'Start with a chapter below. Reviews appear here as they fall due.')}</p></div>
  <button class="btn pri" data-act="review" ${st.due?'':'disabled'}>Start review</button>${st.seen?`<button class="btn" data-act="mixed">Mixed practice</button>`:''}</div></div>`;
  for(const g of DB.groups){
    h+=`<div class="eyebrow">${esc(g.title)}</div><p class="dim small" style="margin:-4px 0 10px">${esc(g.sub)}</p>`;
    for(const m of g.manuals){
      if(g.manuals.length>1)h+=`<h3 style="margin:12px 0 8px">${esc(m.title)}</h3>`;
      if(m.rev)h+=`<p class="dim small mono" style="margin-bottom:10px">${esc(m.rev)}</p>`;
      if(!m.chapters.length){h+=`<div class="chap off"><span class="no">–</span><span class="grow">Not loaded yet<div class="meta">Planned for a later step</div></span></div>`;continue}
      for(const c of m.chapters){
        const cid=chIds(c);
        if(!cid.length){h+=`<div class="chap off"><span class="no">${esc(c.num)}</span><span class="grow">${esc(c.title)}<div class="meta">Not loaded yet</div></span></div>`;continue}
        const s=stat(cid);
        h+=`<button class="chap" data-act="chapter" data-id="${esc(c.id)}"><span class="no">${esc(c.num)}</span><span class="grow">${esc(c.title)}<div class="meta">${s.seen}/${s.total} seen · mastery ${s.mastery}%</div><div class="bar g" style="margin-top:6px"><i style="width:${s.mastery}%"></i></div></span>${s.due?`<span class="pill due">${s.due} due</span>`:''}</button>`;
      }
    }
  }
  app.innerHTML=h;
}

function vChapter(){
  const x=CHS[V.arg]; if(!x){go('home');return}
  const c=x.ch, s=stat(chIds(c));
  let h=topBar()+flash()+`<button class="btn sm" data-act="go" data-v="home">← Home</button>
  <div class="eyebrow">${esc(x.man.title)} · Chapter ${esc(c.num)}</div><h1>${esc(c.title)}</h1>
  <p class="dim small mono" style="margin:6px 0 14px">${esc(x.man.rev)}</p>
  <div class="card"><div class="row"><div class="grow"><b>${s.seen}/${s.total}</b> questions seen · mastery <b>${s.mastery}%</b>${s.due?` · <span style="color:var(--amber)">${s.due} due</span>`:''}</div>
  <button class="btn" data-act="trainch" data-id="${esc(c.id)}">Train chapter, mixed</button></div></div>`;
  for(const sec of c.sections){
    const t=stat(secIds(sec)), l=light(t.n,t.ok);
    h+=`<div class="card"><div class="row"><div class="grow"><h3>${esc(sec.title)}</h3><div class="dim small mono">${esc(sec.ref)} · ${t.total} questions</div></div><span class="${l[1]}" title="Hit rate over all answers">${l[0]}</span>${t.due?`<span class="pill due">${t.due} due</span>`:''}</div>
    <div class="bar g" style="margin:12px 0"><i style="width:${t.mastery}%"></i></div>
    <div class="row"><button class="btn pri" data-act="trainsec" data-id="${esc(sec.id)}">${t.seen?(t.due||t.fresh?'Continue':'Practise again'):'Start'}</button><button class="btn" data-act="brief" data-id="${esc(sec.id)}">Briefing</button><span class="dim small">${t.fresh?t.fresh+' new':'all seen'}</span></div></div>`;
  }
  app.innerHTML=h;
}

function vBrief(){
  const x=SECS[V.arg]; if(!x){go('home');return}
  app.innerHTML=topBar()+`<button class="btn sm" data-act="chapter" data-id="${esc(x.ch.id)}">← Chapter ${esc(x.ch.num)}</button>
  <div class="eyebrow">Briefing · ${esc(x.sec.ref)}</div><h1>${esc(x.sec.title)}</h1>
  <div class="card" style="margin-top:14px"><p class="dim small">Key points in condensed form. The manual remains the only authoritative source. You can also skip this and test yourself first.</p>
  <ul class="brief">${x.sec.brief.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
  <button class="btn pri" data-act="trainsec" data-id="${esc(x.sec.id)}">Train this section</button>`;
}

function optRow(i,key,label,cls,tag,dis){return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${dis?'disabled':''}><span class="k">${key}</span><span>${esc(label)}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`}
function vSession(){
  if(!SES){go('home');return}
  const c=SES.cur, x=IDX[c.id], it=x.it, fb=SES.phase==='fb';
  const done=Object.keys(SES.first).length, tot=new Set(SES.queue).size;
  let h=topBar()+`<div class="prog"><button class="btn sm" data-act="quit">✕ End</button><span class="grow">${esc(SES.title)}</span>${SES.run>=3?`<span class="pill ok" title="Correct first attempts in a row">${SES.run} in a row</span>`:''}<span class="mono">${Math.min(done+(fb?0:1),tot)}/${tot}</span></div>
  <div class="bar" style="margin-bottom:16px"><i style="width:${pct(done,tot)}%"></i></div>`;
  if(SES.practice&&SES.i===0&&!fb)h+=`<div class="note">Nothing is due here. This is extra practice: correct answers do not move review dates forward.</div>`;
  const kind=it.k==='scen'?'<span class="pill cy">Scenario</span>':'';
  const again=(c.id in SES.first)&&!(fb&&!SES.res.isRetest)?'<span class="pill due">Repeat</span>':'';
  h+=`<div class="row" style="gap:8px"><span class="pill">${esc(x.man.title)} ${esc(x.ch.num)}</span>${kind}${again}</div><p class="q">${esc(it.q)}</p>`;
  if(it.t==='mc'){
    c.order.forEach((oi,n)=>{let cls='',tag='';if(fb){if(oi===it.a){cls='right';tag='correct'}else if(oi===c.sel){cls='wrong';tag='your answer'}}else if(c.sel===oi)cls='sel';h+=optRow(oi,n+1,it.o[oi],cls,tag,fb)});
  }else if(it.t==='tf'){
    [true,false].forEach((v,n)=>{let cls='',tag='';if(fb){if(v===it.a){cls='right';tag='correct'}else if(v===c.sel){cls='wrong';tag='your answer'}}else if(c.sel===v)cls='sel';h+=optRow(v?'t':'f',n+1,v?'True':'False',cls,tag,fb)});
  }else if(it.t==='ms'){
    const want=new Set(it.a);
    c.order.forEach((oi,n)=>{const on=!!c.multi[oi];let cls=on?'sel':'',tag='';if(fb){if(want.has(oi)){cls='right';tag=on?'correct':'missed'}else if(on){cls='wrong';tag='not correct'}else cls=''}h+=optRow(oi,on?'☑':'☐',it.o[oi],cls,tag,fb)});
  }else if(it.t==='num'){
    h+=`<div class="numrow"><input type="text" inputmode="decimal" id="num" value="${esc(c.num)}" ${fb?'disabled':''} aria-label="Your answer" autocomplete="off"><span class="mono dim">${esc(it.unit||'')}</span></div>`;
    if(fb)h+=`<p class="mono">Correct: <b style="color:var(--green)">${it.unit==='FL'?'FL '+it.a:it.a+' '+esc(it.unit||'')}</b></p>`;
  }else if(it.t==='fill'){
    h+=`<div class="numrow wide"><input type="text" id="num" value="${esc(c.num)}" ${fb?'disabled':''} aria-label="Your answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer"></div>`;
    if(fb)h+=`<p>Correct: <b style="color:var(--green)">${esc(it.a[0])}</b></p>`;
  }else if(it.t==='od'){
    h+=`<div class="built">${c.built.map((v,n)=>`<button class="chipb ${fb?(v===n?'right':'wrong'):''}" data-act="unpick" data-i="${n}" ${fb?'disabled':''}><span class="k">${n+1}</span><span>${esc(it.seq[v])}</span></button>`).join('')}</div>`;
    if(!fb)h+=`<div class="pool">${c.pool.filter(v=>!c.built.includes(v)).map(v=>`<button class="chipb" data-act="chip" data-i="${v}"><span class="k">+</span><span>${esc(it.seq[v])}</span></button>`).join('')}</div>`;
    else if(!SES.res.ok)h+=`<p class="dim small" style="margin:10px 0 6px">Correct order</p><div class="pool">${it.seq.map((t,n)=>`<div class="chipb right"><span class="k">${n+1}</span><span>${esc(t)}</span></div>`).join('')}</div>`;
  }else if(it.t==='mt'){
    h+='<div class="mt">';
    it.pairs.forEach((p,i)=>{
      const bad=fb&&c.map[i]!==p[1];
      h+=`<div class="l">${esc(p[0])}</div><div><select data-mt="${i}" ${fb?'disabled':''} aria-label="${esc(p[0])}" style="${fb?('border-color:var(--'+(bad?'red':'green')+')'):''}"><option value="">Select …</option>${c.right.map(r=>`<option ${c.map[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select>${bad?`<div class="small" style="color:var(--green);margin-top:4px">→ ${esc(p[1])}</div>`:''}</div>`;
    });
    h+='</div>';
  }
  if(!fb){
    const ready=answered(it,c);
    if(S.set.conf)h+=`<div class="conf"><div class="dim small" style="margin-bottom:8px">How sure are you? Your choice submits the answer.</div><div class="row"><button class="btn pri" data-act="submit" data-c="sure" ${ready?'':'disabled'}>Sure</button><button class="btn" data-act="submit" data-c="fair" ${ready?'':'disabled'}>Fairly sure</button><button class="btn" data-act="submit" data-c="guess" ${ready?'':'disabled'}>Guess</button></div></div>`;
    else h+=`<div class="conf"><button class="btn pri" data-act="submit" data-c="fair" ${ready?'':'disabled'}>Check</button></div>`;
  }else{
    const r=SES.res;
    h+=`<div class="fb ${r.ok?'ok':'no'}" role="status"><div class="v">${r.ok?'Correct':'Not correct'}${r.gain?` <span class="mono small">+${r.gain} XP</span>`:''}</div>`;
    if(!r.ok&&r.conf==='sure')h+=`<div class="note">Confident error. Flagged in Progress until you answer it correctly with confidence.</div>`;
    if(r.ok&&r.conf==='guess'&&!r.isRetest)h+=`<div class="note">Guessed correctly. It will come back soon to confirm.</div>`;
    h+=`<p class="why">${esc(it.why)}</p><span class="pill cy ref">${esc(it.ref)}</span></div>
    <div style="margin-top:14px"><button class="btn pri" id="next" data-act="next">${SES.i+1>=SES.queue.length?'Finish':'Next'}</button></div>`;
  }
  app.innerHTML=h;
  const ni=document.getElementById('num'); if(ni&&!fb&&document.activeElement!==ni&&!c.num)ni.focus();
}

function vResult(){
  if(!SES){go('home');return}
  const ids=Object.keys(SES.first), ok=ids.filter(i=>SES.first[i]).length, r1=rankOf(S.xp);
  const miss=ids.filter(i=>!SES.first[i]);
  let h=topBar()+`<div class="eyebrow">Session complete</div><h1>${esc(SES.title)}</h1>
  <div class="stats3" style="margin-top:14px"><div class="card"><div class="big" style="color:var(--green)">${ok}/${ids.length}</div><div class="lbl">first attempt</div></div>
  <div class="card"><div class="big" style="color:var(--mag)">+${SES.xp}</div><div class="lbl">XP</div></div>
  <div class="card"><div class="big" style="color:var(--cyan)">${S.streak.days}</div><div class="lbl">day streak</div></div></div>`;
  if(r1>SES.rank0)h+=`<div class="card hl" style="margin-top:14px"><b style="color:var(--mag)">New rank: ${esc(RANKS[r1][1])}</b></div>`;
  if(miss.length){
    h+=`<div class="card" style="margin-top:14px"><h3>To revisit</h3><p class="dim small">These return tomorrow.</p>`;
    for(const id of miss){const it=IDX[id].it;h+=`<div class="miss"><div>${esc(it.q)}</div><div class="small dim" style="margin-top:4px">${esc(it.why)}</div><span class="pill cy" style="margin-top:6px;display:inline-block">${esc(it.ref)}</span></div>`}
    h+='</div>';
  }else h+=`<div class="card" style="margin-top:14px">All correct on first attempt.</div>`;
  h+=`<div class="row" style="margin-top:14px"><button class="btn pri" data-act="back">Continue</button><button class="btn" data-act="go" data-v="home">Home</button></div>`;
  app.innerHTML=h;
}

function vStats(){
  const ids=allIds(), st=stat(ids), boxes=[0,0,0,0,0,0];
  for(const id of ids){const s=S.items[id];if(s)boxes[s.b]++}
  let h=topBar()+flash()+`<h1>Progress</h1>
  <div class="stats3" style="margin-top:14px"><div class="card"><div class="big">${st.seen}/${st.total}</div><div class="lbl">questions seen</div></div>
  <div class="card"><div class="big">${st.n?pct(st.ok,st.n)+'%':'–'}</div><div class="lbl">hit rate, all answers</div></div>
  <div class="card"><div class="big">${S.streak.best}</div><div class="lbl">best day streak</div></div></div>
  <div class="card" style="margin-top:14px"><h3>Review stages</h3><p class="dim small">Each correct answer moves a question one stage up; the next review comes after the interval shown.</p>
  <div class="boxes">${boxes.map((n,i)=>`<div><b>${i===0?st.fresh+n:n}</b><span>${i===0?'new':INTERVALS[i]+' d'}</span></div>`).join('')}</div></div>
  <div class="card"><h3>By section</h3><div class="tw"><table><thead><tr><th>Section</th><th class="n">Seen</th><th class="n">Hit rate</th><th class="n">Mastery</th></tr></thead><tbody>`;
  for(const sid of Object.keys(SECS)){const x=SECS[sid],t=stat(secIds(x.sec)),l=light(t.n,t.ok);
    h+=`<tr><td>${esc(x.sec.title)}<div class="small dim mono">${esc(x.sec.ref)}</div></td><td class="n">${t.seen}/${t.total}</td><td class="n"><span class="${l[1]}">${l[0]}</span></td><td class="n">${t.mastery}%</td></tr>`}
  h+=`</tbody></table></div><p class="dim small" style="margin-top:10px">Hit rate: red below 60 %, amber 60–85 %, green from 85 %. “–” means fewer than 3 answers.</p></div>`;
  const sw=ids.filter(i=>S.items[i]&&S.items[i].sw);
  h+=`<div class="card"><div class="row"><div class="grow"><h3>Confident errors</h3><p class="dim small">Answered wrong while sure. These deserve a look in the manual.</p></div>${sw.length?`<button class="btn" data-act="trainsw">Train these</button>`:''}</div>`;
  if(!sw.length)h+=`<p class="dim" style="margin-top:8px">None flagged.</p>`;
  for(const id of sw){const it=IDX[id].it;h+=`<div class="miss"><div>${esc(it.q)}</div><span class="pill cy" style="margin-top:6px;display:inline-block">${esc(it.ref)}</span></div>`}
  h+='</div>';
  app.innerHTML=h;
}

function vSettings(){
  let h=topBar()+flash()+`<h1>Settings</h1>
  <div class="card" style="margin-top:14px"><h3>Session length</h3><div class="seg" style="margin-top:10px">${[5,10,15,20].map(n=>`<button data-act="len" data-n="${n}" class="${S.set.len===n?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="card"><h3>Confidence rating</h3><p class="dim small">Rate how sure you are before the answer is revealed. Confident errors are flagged; correct guesses come back sooner.</p>
  <div class="seg" style="margin-top:10px"><button data-act="conf" data-on="1" class="${S.set.conf?'on':''}">On</button><button data-act="conf" data-on="0" class="${S.set.conf?'':'on'}">Off</button></div></div>
  <div class="card"><h3>Backup and transfer</h3><p class="dim small">Progress is stored in this browser only. Export it before changing device or clearing browser data.</p>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="exfile">Download file</button><button class="btn" data-act="exshare">Share / save</button><button class="btn" data-act="extext">Show as text</button></div>
  <div class="row" style="margin-top:10px"><label class="btn" style="cursor:pointer">Load file<input type="file" id="imf" accept=".json,application/json" style="display:none"></label><button class="btn" data-act="imtext">Load from text</button></div>
  <textarea id="bk" style="margin-top:10px" placeholder="Backup text appears here. To restore, paste a backup and press “Load from text”." aria-label="Backup text"></textarea><div class="msg" id="bmsg" role="status"></div></div>
  <div class="card"><h3>Device</h3><div class="row" style="margin-top:10px"><button class="btn" data-act="lock">Lock now</button><button class="btn warn" data-act="reset">Reset progress</button></div>
  <p class="dim small" style="margin-top:10px">“Lock now” removes the stored key from this device; the passphrase is needed again. Content build: ${esc(DB.built||'')}.</p></div>`;
  app.innerHTML=h;
  document.getElementById('imf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f)});
}
function backupText(){return JSON.stringify({app:KEY,exported:new Date().toISOString(),state:S})}
function bmsg(t,bad){const m=document.getElementById('bmsg');if(m){m.textContent=t;m.style.color=bad?'var(--red)':'var(--green)'}}
function importText(txt){
  let o=null;try{o=JSON.parse(txt)}catch(e){}
  if(!o||o.app!==KEY||!o.state||typeof o.state!=='object'){bmsg('This is not a valid Flight Deck Trainer backup.',true);return}
  S=normalize(o.state);save();FLASH=`Backup loaded: ${S.xp} XP, ${Object.keys(S.items).length} questions with progress.`;render();
}
const fname=()=>`FlightDeckTrainer_${new Date().toISOString().slice(0,10)}.json`;

function render(){
  if(!DB){vLock();return}
  ({home:vHome,chapter:vChapter,brief:vBrief,session:vSession,result:vResult,stats:vStats,settings:vSettings}[V.name]||vHome)();
}

/* ---------- events ---------- */
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='go'){SES=null;go(b.dataset.v)}
  else if(a==='chapter')go('chapter',b.dataset.id)
  else if(a==='brief')go('brief',b.dataset.id)
  else if(a==='trainsec'){const x=SECS[b.dataset.id];startSession(x.sec.title,secIds(x.sec),{back:{name:'chapter',arg:x.ch.id}})}
  else if(a==='trainch'){const x=CHS[b.dataset.id];startSession(`${x.man.title} ${x.ch.num}, mixed`,chIds(x.ch),{interleave:true,back:{name:'chapter',arg:x.ch.id}})}
  else if(a==='review'){const t=today();startSession('Daily review',allIds().filter(i=>S.items[i]&&S.items[i].d<=t),{interleave:true})}
  else if(a==='mixed')startSession('Mixed practice',allIds().filter(i=>S.items[i]),{fixed:true})
  else if(a==='trainsw')startSession('Confident errors',allIds().filter(i=>S.items[i]&&S.items[i].sw),{fixed:true,back:{name:'stats'}})
  else if(a==='pick'){
    if(!SES||SES.phase!=='q')return;const c=SES.cur,it=IDX[c.id].it,i=b.dataset.i;
    if(it.t==='mc')c.sel=+i;else if(it.t==='tf')c.sel=(i==='t');else if(it.t==='ms')c.multi[+i]=!c.multi[+i];
    render();
  }
  else if(a==='chip'){if(SES&&SES.phase==='q'){SES.cur.built.push(+b.dataset.i);render()}}
  else if(a==='unpick'){if(SES&&SES.phase==='q'){SES.cur.built.splice(+b.dataset.i,1);render()}}
  else if(a==='submit')submit(b.dataset.c)
  else if(a==='next')next()
  else if(a==='quit'){const bk=SES.back;if(Object.keys(SES.first).length){finish(true)}else{SES=null;go(bk.name,bk.arg)}}
  else if(a==='back'){const bk=SES?SES.back:{name:'home'};SES=null;go(bk.name,bk.arg)}
  else if(a==='len'){S.set.len=+b.dataset.n;save();render()}
  else if(a==='conf'){S.set.conf=b.dataset.on==='1';save();render()}
  else if(a==='exfile'){const u=URL.createObjectURL(new Blob([backupText()],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=fname();document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);bmsg(`Backup file created: ${S.xp} XP, ${Object.keys(S.items).length} questions.`)}
  else if(a==='exshare'){
    try{const f=new File([backupText()],fname(),{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Flight Deck Trainer backup'});bmsg('Backup shared.')}
      else bmsg('Sharing files is not available in this browser. Use “Download file” or “Show as text”.',true);
    }catch(err){if(err&&err.name!=='AbortError')bmsg('Sharing failed. Use “Show as text”.',true)}
  }
  else if(a==='extext'){const t=document.getElementById('bk');t.value=backupText();t.select();bmsg('Backup shown as text. Copy it and keep it somewhere safe.')}
  else if(a==='imtext'){const t=document.getElementById('bk').value.trim();if(!t){bmsg('Paste a backup into the text field first.',true);return}importText(t)}
  else if(a==='lock'){try{localStorage.removeItem(KKEY)}catch(_){}DB=null;SES=null;V={name:'lock'};render()}
  else if(a==='reset'){if(b.dataset.armed){S=blank();save();SES=null;FLASH='Progress reset.';render()}else{b.dataset.armed='1';b.textContent='Tap again to confirm reset'}}
});
app.addEventListener('input',e=>{
  if(!SES||SES.phase!=='q')return;
  if(e.target.id==='num'){SES.cur.num=e.target.value;const ready=e.target.value.trim()!=='';app.querySelectorAll('[data-act="submit"]').forEach(x=>x.disabled=!ready)}
});
app.addEventListener('change',e=>{
  if(!SES||SES.phase!=='q')return;
  const i=e.target.dataset&&e.target.dataset.mt;
  if(i!==undefined){SES.cur.map[+i]=e.target.value;const it=IDX[SES.cur.id].it;const ready=answered(it,SES.cur);app.querySelectorAll('[data-act="submit"]').forEach(x=>x.disabled=!ready)}
});
document.addEventListener('keydown',e=>{
  if(V.name!=='session'||!SES||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(SES.phase==='q'){
    if(e.key==='Enter'&&tag==='input'&&!S.set.conf){e.preventDefault();submit('fair');return}
    if(tag==='input'||tag==='select'||tag==='textarea')return;
    if(/^[1-9]$/.test(e.key)){const o=app.querySelectorAll('.opt');const el=o[+e.key-1];if(el){e.preventDefault();el.click()}}
  }
});

/* ---------- boot ---------- */
(async()=>{
  let raw=null;try{const k=localStorage.getItem(KKEY);if(k)raw=ub(k)}catch(_){}
  if(raw&&window.crypto&&crypto.subtle){try{await openWith(raw);S=load();V={name:'home'}}catch(_){try{localStorage.removeItem(KKEY)}catch(e){}}}
  render();
})();
</script>
</body>
